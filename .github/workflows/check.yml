name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  RUFF_VERSION: 0.17.4

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: pipx run "ruff==$RUFF_VERSION" check .
      - run: pipx run "ruff==$RUFF_VERSION" format --check .
      - run: pip install . pytest
      - run: pytest
