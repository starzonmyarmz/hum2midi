[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hum2midi"
version = "0.6.1"
description = "Convert hummed or monophonic audio recordings to quantized MIDI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Daniel Marino"},
  {name = "Claude", email = "noreply@anthropic.com"},
]
dependencies = ["librosa", "pretty_midi", "soundfile", "scipy", "numpy"]

[project.scripts]
hum2midi = "hum2midi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = [
  "RUF007",  # itertools.pairwise needs Python 3.10
  "RUF046",  # int(round(x)) isn't redundant when x is a numpy float
]
